name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Offline snapshot from fixtures, then check the Worker bundles (no deploy).
      - run: npx tsx scripts/build-snapshot.ts --fixtures test/fixtures/sec
      - run: npx wrangler deploy --dry-run --outdir dist
